name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build-linux:
    name: Build Linux configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Build home-manager configuration (linux)
        run: |
          echo "Building home-manager configuration for linux..."
          nix build .#homeConfigurations.linux.activationPackage --no-link

      - name: Check flake
        run: |
          nix flake check --no-build

  build-darwin:
    name: Build macOS configuration
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Build nix-darwin configuration
        run: |
          echo "Building nix-darwin configuration..."
          nix build .#darwinConfigurations."Mohibs-MacBook-Pro".system --no-link

      - name: Check flake
        run: |
          nix flake check --no-build
