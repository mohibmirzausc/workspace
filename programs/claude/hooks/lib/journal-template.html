<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — session journal</title>

<!-- Discovery markers. These let an agent identify this journal over HTTP,
     without filesystem access to meta.json. Session and pane ids are NOT here:
     they accumulate over the journal's life, and this shell is written once. -->
<!-- Hash of the template this page was rendered from. sj_init compares it and
     regenerates the page when the template changes, so an existing journal
     picks up page fixes instead of keeping its original shell forever. -->
<meta name="session-journal:template-version" content="{{TEMPLATE_VERSION}}">
<meta name="session-journal:workspace-id" content="{{WORKSPACE_ID}}">
<meta name="session-journal:repo" content="{{REPO}}">
<meta name="session-journal:branch" content="{{BRANCH}}">
<meta name="session-journal:cwd" content="{{CWD}}">
<script type="application/json" id="sj-markers">
{"kind":"session-journal","workspace_id":"{{WORKSPACE_ID}}","repo":"{{REPO}}",
 "branch":"{{BRANCH}}","cwd":"{{CWD}}","created":"{{CREATED}}",
 "note":"session_ids and pane_ids accumulate in meta.json and entries.txt"}
</script>

<style>
  :root{
    --bg:#12131a; --panel:#181a23; --line:#272a37; --ink:#e7e9f0; --dim:#9aa0b4;
    --accent:#7aa2f7; --agent:#9ece6a; --hook:#565b70; --sub:#bb9af7; --warn:#f7768e;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 var(--mono);padding:24px 20px 80px}
  header{max-width:920px;margin:0 auto 18px;border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{margin:0 0 6px;font-size:17px;letter-spacing:.3px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .bar{max-width:920px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
    border-radius:5px;padding:4px 11px;font:12px var(--mono);cursor:pointer}
  .bar button:hover{color:var(--ink)}
  .bar button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
  #live{margin-left:auto;color:var(--dim);font-size:11px}
  #live.ok::before{content:"● ";color:var(--agent)}
  #live.off::before{content:"● ";color:var(--warn)}
  #log{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .e{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hook);
     border-radius:6px;padding:9px 12px}
  .e[data-source="agent"]{border-left-color:var(--agent)}
  .e[data-source="subagent"]{border-left-color:var(--sub)}
  .e[data-kind="blocker"]{border-left-color:var(--warn)}
  /* Prompts are navigation anchors, not events — set them apart. */
  .e[data-kind="prompt"]{background:#1b1d2b;border-left-color:var(--accent)}
  .e[data-kind="prompt"] .t{color:var(--accent)}
  .m{display:flex;gap:10px;align-items:baseline;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .k{color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
  .t{margin:3px 0 0;font-size:13.5px;color:var(--ink)}
  /* Bodies are rendered markdown, so pre-wrap must NOT be set here — it would
     preserve the source newlines between block elements as blank gaps. <pre>
     re-enables it for code only. */
  .b{margin:6px 0 0;word-break:break-word;color:#c3c8d8;
     font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px}
  .b > :first-child{margin-top:0}
  .b > :last-child{margin-bottom:0}
  .b p{margin:6px 0;white-space:pre-wrap}
  .b .mdh{margin:10px 0 4px;color:var(--ink);font-weight:600;letter-spacing:.2px}
  .b strong{color:var(--ink);font-weight:600}
  .b em{color:#d7dcea;font-style:italic}
  .b code{background:#0e0f16;border:1px solid var(--line);border-radius:3px;
          padding:.5px 4px;font-size:11.5px;color:#e0c98a}
  .b pre{background:#0e0f16;border:1px solid var(--line);border-radius:5px;
         padding:8px 10px;overflow-x:auto;margin:8px 0;white-space:pre}
  .b pre code{background:none;border:0;padding:0;color:#c3c8d8}
  .b ul,.b ol{margin:6px 0;padding-left:20px}
  .b li{margin:2px 0}
  .b blockquote{margin:8px 0;padding:2px 0 2px 10px;border-left:2px solid var(--line);color:var(--dim)}
  .b hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .b table{border-collapse:collapse;margin:8px 0;font-size:11.5px;display:block;
           overflow-x:auto;max-width:100%}
  .b th,.b td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
  .b th{color:var(--accent);font-weight:600;background:#1b1d2b}
  .empty{color:var(--dim);text-align:center;padding:48px 0}
  footer{max-width:920px;margin:34px auto 0;color:var(--dim);font-size:11px;
         border-top:1px solid var(--line);padding-top:12px}
  footer dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0}
  footer dt{color:var(--accent)}
  footer dd{margin:0}
  @media (max-width:420px){
    body{padding:14px 10px 60px}
    .m{gap:6px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <div class="sub">
    <span>{{REPO}} · {{BRANCH}}</span>
    <span>workspace {{WORKSPACE_ID}}</span>
    <span id="count">—</span>
  </div>
</header>

<div class="bar" role="group" aria-label="Filter entries">
  <button data-f="all" aria-pressed="true">all</button>
  <button data-f="agent" aria-pressed="false">reasoning</button>
  <button data-f="prompt" aria-pressed="false">prompts</button>
  <button data-f="hook" aria-pressed="false">activity</button>
  <button data-f="subagent" aria-pressed="false">subagents</button>
  <span id="live">connecting…</span>
</div>

<main id="log"><div class="empty">No entries yet.</div></main>

<footer>
  <!-- html-page stamp: the gallery extracts these exact <dt> labels. -->
  <dl>
    <dt>Style</dt><dd>Session journal</dd>
    <dt>Keywords</dt><dd>live session log · decisions · progress</dd>
    <dt>Recreate prompt</dt><dd>Session journal — auto-maintained by the session-journal hooks.</dd>
  </dl>
  <p>Auto-updating every 3s · created {{CREATED}}</p>
</footer>

<script>
// Deliberately NO EventSource. The gallery server broadcasts SSE reloads on file
// changes; subscribing would make this page hard-reload on every append. We poll
// entries.txt instead and re-render only when the content actually differs.
(function () {
  var log = document.getElementById('log');
  var countEl = document.getElementById('count');
  var liveEl = document.getElementById('live');
  var filter = 'all';
  var lastRaw = null;
  var entries = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Minimal markdown renderer.
  //
  // Bodies are agent-written markdown, so the raw text showed literal "##" and
  // "**" to the human. Deliberately hand-rolled rather than a CDN library: this
  // page must render with no network (it is opened from a local gallery), and it
  // must stay one self-contained file with no build step.
  //
  // SECURITY: esc() runs FIRST on the whole input, so everything below operates
  // on already-escaped text and can only ever introduce the tags it writes
  // itself. Never reorder this — inserting markup before escaping would make a
  // commit message or a filename an XSS vector.
  function md(src) {
    var lines = esc(String(src == null ? '' : src)).split('\n');
    var out = [];
    var i = 0;

    function inline(s) {
      // Stash code spans behind sentinels BEFORE any other rule runs, and restore
      // them last, so their contents are never eligible for emphasis or link
      // rules. Replacing them with <code> up front is not enough: the emphasis
      // rules then match the ** inside the emitted tag, so `**not bold**` came
      // out bold.
      //
      // The sentinel is \u0000, which cannot be forged by the text being
      // rendered: esc() has already run, and a NUL cannot survive the JSON
      // entry body that carries this text. A printable sentinel could be forged.
      var spans = [];
      s = s.replace(/`([^`]+)`/g, function (_m, code) {
        spans.push(code);
        return '\u0000' + (spans.length - 1) + '\u0000';
      });
      return s
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
        .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
        // Links: http(s) and relative paths ONLY, so a javascript: or data: URL
        // in agent-written text can never become a live href.
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\.{0,2}\/[^\s)]*)\)/g,
          function (_m, text, href) {
            return '<a href="' + href + '" rel="noopener noreferrer" target="_blank">' + text + '</a>';
          })
        .replace(/\u0000(\d+)\u0000/g, function (_m, n) {
          return '<code>' + spans[Number(n)] + '</code>';
        });
    }

    function isTableSep(s) { return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.indexOf('-') > -1; }
    function cells(s) {
      return s.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
    }

    while (i < lines.length) {
      var l = lines[i];

      if (/^\s*$/.test(l)) { i++; continue; }

      // Fenced code block.
      if (/^\s*```/.test(l)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
        continue;
      }

      // Table: a header row plus a |---|---| separator.
      if (l.indexOf('|') > -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = cells(l);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') > -1 && !/^\s*$/.test(lines[i])) {
          rows.push(cells(lines[i])); i++;
        }
        out.push('<table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') +
          '</tbody></table>');
        continue;
      }

      // Heading. Rendered as <strong> block: real <h*> inside a log entry would
      // out-shout the entry title and wreck the visual hierarchy.
      var h = /^\s*(#{1,6})\s+(.*)$/.exec(l);
      if (h) { out.push('<p class="mdh">' + inline(h[2]) + '</p>'); i++; continue; }

      // Horizontal rule.
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }

      // Blockquote.
      if (/^\s*&gt;\s?/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++;
        }
        out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>');
        continue;
      }

      // List (bulleted or numbered); nesting is flattened, which is fine here.
      if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l);
        var items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, '')); i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') +
          items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') +
          (ordered ? '</ol>' : '</ul>'));
        continue;
      }

      // Paragraph: consume until a blank line or the start of another block.
      var p = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^\s*(```|#{1,6}\s|&gt;|([-*+]|\d+\.)\s)/.test(lines[i]) &&
             !(lines[i].indexOf('|') > -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        p.push(lines[i]); i++;
      }
      if (p.length) out.push('<p>' + inline(p.join('\n')) + '</p>');
      else i++;
    }
    return out.join('');
  }

  function timeAgo(iso) {
    var t = new Date(iso).getTime();
    if (!iso || isNaN(t)) return '';
    // Clamp: clock skew between panes can put an entry slightly in the future,
    // which would otherwise render as "-2284904532s ago".
    var s = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function render() {
    var list = entries.filter(function (e) {
      if (filter === 'all') return true;
      // "prompts" selects a kind; the others select a source. Prompts are
      // written by a hook, so filtering them by source would not work.
      if (filter === 'prompt') return e.kind === 'prompt';
      if (filter === 'hook') return e.source === 'hook' && e.kind !== 'prompt';
      return e.source === filter;
    }).slice().reverse();

    countEl.textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');

    if (!list.length) {
      log.innerHTML = '<div class="empty">' +
        (entries.length ? 'No entries match this filter.' : 'No entries yet.') + '</div>';
      return;
    }

    log.innerHTML = list.map(function (e) {
      return '<article class="e" data-source="' + esc(e.source) + '" data-kind="' + esc(e.kind) + '">' +
        '<div class="m">' +
          '<span class="k">' + esc(e.kind) + '</span>' +
          '<span title="' + esc(e.ts) + '">' + esc(timeAgo(e.ts)) + '</span>' +
          (e.agent && e.agent !== 'main' ? '<span>' + esc(e.agent) + '</span>' : '') +
          (e.pane_id ? '<span>pane ' + esc(String(e.pane_id).slice(0, 6)) + '</span>' : '') +
        '</div>' +
        '<p class="t">' + esc(e.title) + '</p>' +
        (e.body ? '<div class="b">' + md(e.body) + '</div>' : '') +
      '</article>';
    }).join('');
  }

  function parse(raw) {
    return raw.split('\n').filter(Boolean).map(function (l) {
      try { return JSON.parse(l); } catch (err) { return null; }
    }).filter(Boolean);
  }

  function poll() {
    fetch('entries.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function (raw) {
        liveEl.textContent = 'live';
        liveEl.className = 'ok';
        if (raw === lastRaw) return;
        lastRaw = raw;
        entries = parse(raw);
        render();
      })
      .catch(function () {
        liveEl.textContent = 'offline — open via localhost:7777';
        liveEl.className = 'off';
      });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.bar button'), function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.f;
      Array.prototype.forEach.call(document.querySelectorAll('.bar button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      render();
    });
  });

  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
